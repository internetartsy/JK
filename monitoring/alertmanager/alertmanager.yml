global:
  smtp_smarthost: 'localhost:25'
  smtp_from: 'alertmanager@land-records.local'
  smtp_require_tls: false

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-receiver'

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://backend:8000/api/v1/webhooks/alert'
        send_resolved: true

  - name: 'critical-receiver'
    webhook_configs:
      - url: 'http://backend:8000/api/v1/webhooks/alert'
        send_resolved: true
    # Uncomment and configure for Slack/email notifications
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#land-records-alerts'
    #     send_resolved: true

  - name: 'warning-receiver'
    webhook_configs:
      - url: 'http://backend:8000/api/v1/webhooks/alert'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
