[package]
name = "rust-shield"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-rt = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.2"
aes-gcm = "0.10"
base64 = "0.21"
governor = "0.6"
nonzero_ext = "0.3"
log = "0.4"
env_logger = "0.10"
dotenv = "0.15"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "uuid"] }
