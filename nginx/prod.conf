events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:80;
    }

    upstream gateway {
        server security-gateway:8090;
    }

    upstream frappe {
        server erp-web:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend (Static Files)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Gateway (Proxies to Backend & Frappe)
        location /api {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frappe Direct Access (if needed, or via Gateway)
        # Gateway handles /api logic, but Frappe has its own UI at /app
        location /app {
            proxy_pass http://frappe;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        location /assets {
            proxy_pass http://frappe;
            proxy_set_header Host $host;
        }
        
        location /files {
            proxy_pass http://frappe;
            proxy_set_header Host $host;
        }
    }
}
